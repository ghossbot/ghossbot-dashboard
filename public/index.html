<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GhossBot Dashboard</title>

    <link
        rel="stylesheet"
        href="/style.css?v=4"
    >

</head>


<body class="login-page">


    <main class="login-container">


        <section class="login-card">


            <div class="login-logo">

                <div class="login-logo-icon">
                    G
                </div>

            </div>


            <h1>
                GhossBot
            </h1>


            <p>
                Panel de control para configurar
                y administrar GhossBot en tus servidores.
            </p>


            <a
                href="/auth/discord"
                class="discord-login-button"
            >

                <span class="discord-icon">
                    💬
                </span>

                Iniciar sesión con Discord

            </a>


            <div class="login-footer">

                <span>
                    GhossBot Dashboard
                </span>

                <span>
                    •
                </span>

                <span>
                    v1.0.0
                </span>

            </div>


        </section>


    </main>


</body>

</html>
